[project]
name = "magic-hermes"
version = "0.1.0.dev0"
description = "Magic Context connector plugin for hermes-agent (client to the subc daemon)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.entry-points."hermes_agent.plugins"]
magic_hermes = "magic_hermes.plugin:register"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magic_hermes"]
