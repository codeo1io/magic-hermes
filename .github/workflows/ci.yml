name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test battery (pinned Magic Context)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install repo-pinned Magic Context package
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Create validation environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: Lint (ruff)
        run: .venv/bin/ruff check src tests scripts

      - name: Syntax-check bridge modules (node)
        run: |
          node --check src/magic_hermes/bridge/loader.mjs
          node --check src/magic_hermes/bridge/runtime.mjs

      - name: Run test battery against the pinned package
        env:
          MAGIC_CONTEXT_PACKAGE_ROOT: ${{ github.workspace }}/node_modules/@cortexkit/pi-magic-context
        run: .venv/bin/python -m pytest -q
